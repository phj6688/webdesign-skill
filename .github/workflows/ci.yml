name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  workflow_dispatch:

# One run per ref; new pushes cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-skill:
    name: Validate skill & manifests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']  # manifest check must run on the 3.10 floor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Ruff (correctness lint)
        run: |
          python -m pip install --quiet ruff==0.15.10
          ruff check .
      - name: Contrast suite (PyYAML parser)
        run: python skills/webdesign/tests/test_contrast.py
      - name: SKILL.md frontmatter has name + description
        run: |
          python - <<'PY'
          import sys, glob, yaml
          skills = glob.glob('SKILL.md') + glob.glob('skills/**/SKILL.md', recursive=True)
          if not skills:
              print("::error::no SKILL.md found at root or under skills/")
              sys.exit(1)
          bad = 0
          for path in skills:
              text = open(path, encoding='utf-8').read()
              if not text.startswith('---'):
                  print(f"::error file={path}::missing YAML frontmatter")
                  bad += 1; continue
              fm = text.split('---', 2)[1]
              try:
                  data = yaml.safe_load(fm) or {}
              except Exception as e:
                  print(f"::error file={path}::invalid frontmatter YAML: {e}")
                  bad += 1; continue
              for key in ('name', 'description'):
                  if not data.get(key):
                      print(f"::error file={path}::frontmatter missing '{key}'")
                      bad += 1
              print(f"OK: {path}")
          sys.exit(1 if bad else 0)
          PY
      - name: Validate JSON manifests
        run: |
          python - <<'PY'
          import subprocess, sys, json, os
          # git ls-files sees dot-directories; glob('**/*.json') silently skips them,
          # so .claude-plugin/plugin.json (the file the loader parses) went unchecked.
          files = subprocess.run(["git", "ls-files", "*.json"],
                                 capture_output=True, text=True, check=True).stdout.split()
          bad = 0
          for f in files:
              try:
                  json.load(open(f, encoding='utf-8'))
                  print(f"OK: {f}")
              except Exception as e:
                  print(f"::error file={f}::invalid JSON: {e}")
                  bad += 1
          manifest = ".claude-plugin/plugin.json"
          if manifest not in files:
              print(f"::error::{manifest} not found (plugin machinery parses it)")
              bad += 1
          else:
              try:
                  data = json.load(open(manifest, encoding='utf-8'))
                  for key in ("name", "version", "skills"):
                      if not data.get(key):
                          print(f"::error file={manifest}::missing required key '{key}'")
                          bad += 1
                  skills = data.get("skills")
                  if skills and not os.path.exists(skills.lstrip("./")):
                      print(f"::error file={manifest}::skills path '{skills}' does not exist")
                      bad += 1
              except Exception:
                  pass  # JSON parse error already reported above
          sys.exit(1 if bad else 0)
          PY
      - name: Reference links resolve
        run: |
          python - <<'PY'
          import os, re, sys
          base = os.path.join('skills', 'webdesign')
          link = re.compile(r"\]\(([^)]+)\)")
          bad = checked = 0
          for dirpath, dirnames, filenames in os.walk(base):
              dirnames[:] = [d for d in dirnames if d not in {'__pycache__', 'node_modules', '.git'}]
              for name in sorted(filenames):
                  if not name.endswith('.md'):
                      continue
                  path = os.path.join(dirpath, name)
                  text = open(path, encoding='utf-8', errors='replace').read()
                  for match in link.finditer(text):
                      target = match.group(1).strip()
                      if ' "' in target:
                          target = target.split(' "', 1)[0].strip()
                      target = target.strip('<>')
                      if target.startswith(('http://', 'https://', 'mailto:', '#', '/')):
                          continue
                      target = target.split('#', 1)[0].split('?', 1)[0]
                      if not target:
                          continue
                      checked += 1
                      if not os.path.exists(os.path.normpath(os.path.join(dirpath, target))):
                          line = text[: match.start()].count('\n') + 1
                          print(f"::error file={path},line={line}::dead reference link: {target}")
                          bad += 1
          print(f"{checked} local link(s) checked")
          sys.exit(1 if bad else 0)
          PY

  fixtures:
    name: Linter fixture suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']  # enforce the README 3.10 floor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the linter fixture suite
        run: python skills/webdesign/tests/run_fixtures.py
      # No PyYAML in this job on purpose, so the checker's stdlib parser is the one
      # under test here. validate-skill runs the same suite with PyYAML installed.
      - name: Contrast suite (stdlib parser)
        run: python skills/webdesign/tests/test_contrast.py

  dash-ban:
    name: No em dash or en dash (md, sh, py, json, yml, yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan tracked md, sh, py, json, yml and yaml files
        run: |
          python - <<'PY'
          import subprocess, sys
          files = subprocess.run(["git", "ls-files"],
                                 capture_output=True, text=True, check=True).stdout.split("\n")
          bad = 0
          for rel in files:
              rel = rel.strip()
              if not rel.endswith(('.md', '.sh', '.py', '.json', '.yml', '.yaml')):
                  continue
              with open(rel, encoding='utf-8', errors='replace') as handle:
                  for number, line in enumerate(handle, 1):
                      for char, name in ((chr(0x2014), "em dash"), (chr(0x2013), "en dash")):
                          if char in line:
                              print(f"::error file={rel},line={number}::{name} is banned in this repo")
                              bad += 1
          print(f"{bad} offending line(s)")
          sys.exit(1 if bad else 0)
          PY

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run shellcheck on scripts
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts; skipping shellcheck (gate stays green)."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"

  markdownlint:
    name: Markdown (lenient)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: markdownlint (non-blocking style, blocking parse)
        run: |
          mapfile -t md < <(git ls-files '*.md')
          if [ ${#md[@]} -eq 0 ]; then
            echo "No markdown files."
            exit 0
          fi
          for f in "${md[@]}"; do
            if [ ! -s "$f" ]; then echo "::error::empty markdown: $f"; exit 1; fi
          done
          npx --yes markdownlint-cli2 "**/*.md" "#node_modules" || \
            echo "::warning::markdownlint reported style issues (non-blocking)."

  release-consistency:
    name: Release consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: plugin.json version has a CHANGELOG entry (and matches a pushed tag)
        run: |
          python - <<'PY'
          import json, os, re, sys
          version = json.load(open('.claude-plugin/plugin.json', encoding='utf-8'))['version']
          changelog = open('CHANGELOG.md', encoding='utf-8').read()
          if not re.search(rf'^## \[{re.escape(version)}\]', changelog, re.M):
              print(f"::error::CHANGELOG.md has no entry for plugin.json version {version}")
              sys.exit(1)
          print(f"OK: CHANGELOG documents {version}")
          ref = os.environ.get('GITHUB_REF', '')
          if ref.startswith('refs/tags/'):
              tag = ref.split('/', 2)[2]
              if tag != f"v{version}":
                  print(f"::error::tag {tag} != v{version} (plugin.json)")
                  sys.exit(1)
              print(f"OK: tag {tag} matches plugin.json")
          PY

  ci-passed:
    name: CI passed
    if: always()
    needs: [validate-skill, fixtures, dash-ban, shellcheck, markdownlint, release-consistency]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A required CI job did not succeed."
          echo "Results: ${{ join(needs.*.result, ' ') }}"
          exit 1
      - name: All gates green
        run: echo "All CI jobs passed."
